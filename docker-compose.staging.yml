services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql

  backend:
    build: .
    restart: unless-stopped
    env_file: .env.staging
    depends_on:
      - db
    expose:
      - "8000"
    command: >
      sh -c "python manage.py migrate && gunicorn milkshop.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro

volumes:
  dbdata:
  staticfiles:
